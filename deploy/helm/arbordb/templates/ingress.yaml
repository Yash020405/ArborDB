apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arbordb-frontend
  labels:
    {{- include "arbordb.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arbordb-frontend
                port: { name: http }
---
# /api/query -> /query on the API service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arbordb-api
  labels:
    {{- include "arbordb.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "{{ .Values.api.config.MAX_FILE_SIZE_MB }}m"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: arbordb-api
                port: { name: http }
