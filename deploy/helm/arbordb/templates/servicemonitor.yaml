{{- if and .Values.monitoring.serviceMonitor (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: arbordb-api
  labels:
    {{- include "arbordb.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: arbordb-api
  endpoints:
    - port: http
      path: /metrics/prometheus
      interval: 15s
{{- end }}
